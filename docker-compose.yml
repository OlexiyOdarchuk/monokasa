# monokasa: один Go-бінарник із вшитим Svelte-фронтом, усе на :8093.
#
#   docker compose up --build              # backend
#   docker compose --profile tunnel up     # + cloudflared (опційно)
#   docker compose down -v                 # повний reset (видаляє SQLite-volume)
#
# Усі секрети через .env. Обов'язкові — `${VAR:?...}`: compose упаде на
# старті без них, краще ніж тихий старт з порожніми токенами.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monokasa
    restart: unless-stopped
    environment:
      TG_TOKEN: ${TG_TOKEN:?TG_TOKEN must be set in .env (see .env.example)}
      TICKET_SECRET: ${TICKET_SECRET:?TICKET_SECRET must be set in .env}
      MONO_JAR_LINK: ${MONO_JAR_LINK:?MONO_JAR_LINK must be set in .env}
      MONO_TOKEN: ${MONO_TOKEN:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      HTTP_ADDR: ":8093"
      DB_PATH: /data/tix.db
      # Posters live next to the SQLite file on the named volume so the
      # data is one rsync/backup target. Default ("./posters") would land
      # in /posters and fail under distroless-nonroot.
      POSTERS_DIR: /data/posters
      SHOW_TITLE: ${SHOW_TITLE:-Моя вистава}
      SHOW_VENUE: ${SHOW_VENUE:-Театральна площа}
      SHOW_STARTS_AT: ${SHOW_STARTS_AT:-2026-06-01T19:00:00+03:00}
      ROWS: ${ROWS:-5}
      COLS: ${COLS:-6}
      PRICE_KOPECKS: ${PRICE_KOPECKS:-25000}
      HOLD: ${HOLD:-15m}
      REMIND_BEFORE: ${REMIND_BEFORE:-1h}
      SCANNER_TOKEN: ${SCANNER_TOKEN:-}
      ADMIN_TG_ID: ${ADMIN_TG_ID:-0}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Behind cloudflared / a real reverse proxy SECURE_COOKIES=true keeps
      # cookies HTTPS-only. The app also detects X-Forwarded-Proto, so leave
      # at default for plain HTTP localhost dev.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      # Named volume for the SQLite file so it survives `docker compose down`
      # without `-v`. Use `down -v` to wipe state intentionally.
      - db_data:/data
    ports:
      - "${BACKEND_HOST_PORT:-8093}:8093"

  # ==========================================================================
  # Cloudflare Tunnel (optional): publishes the backend on a real HTTPS URL
  # without exposing a public IP or managing TLS certs. Enable with
  # `docker compose --profile tunnel up` after setting CLOUDFLARED_TOKEN.
  #
  # Quick setup (5 min, free):
  #   1. Sign up at https://dash.cloudflare.com (no card required)
  #   2. Zero Trust → Access → Tunnels → Create a tunnel
  #   3. Pick "Cloudflared" connector → copy the token
  #   4. CLOUDFLARED_TOKEN=eyJ... in .env
  #   5. Public hostname: route to http://backend:8093 (service name +
  #      port, *not* localhost — cloudflared resolves it inside compose)
  # ==========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: monokasa-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - backend
    # cloudflared reads TUNNEL_TOKEN from env directly — passing it as a
    # CLI flag with ${VAR:?} would fail at parse time even when the tunnel
    # profile is inactive (Compose interpolates the whole file before
    # filtering by profile). The image errors out clearly if it actually
    # starts with an empty token.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    command: tunnel --no-autoupdate run

volumes:
  db_data:
